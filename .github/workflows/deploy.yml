name: Deploy React to VPS

on:
  push:
    branches: [ "test" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code về
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build production
      - name: Build
        run: npm run build
        env:
         VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      # 5. Copy thư mục build/ lên VPS (thay cho thao tác WinSCP thủ công)
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      # Không cần reload Nginx: file tĩnh được đọc trực tiếp từ đĩa ở mỗi request.
      # Chỉ reload khi đổi file config Nginx (làm tay trên VPS).